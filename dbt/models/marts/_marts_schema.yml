version: 2

models:
  - name: dim_date
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fct_hourly_demand
    description: "One row per hour: actual demand, day-ahead forecast, and the error between them."
    columns:
      - name: demand_hour
        tests:
          - unique
          - not_null
      - name: actual_demand_mwh
        tests:
          - not_null
      - name: demand_date
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_day

  - name: agg_daily_demand
    columns:
      - name: demand_date
        tests:
          - unique
          - not_null
      - name: hours_observed
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 24